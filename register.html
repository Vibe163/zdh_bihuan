<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一元机场 自动化助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .container { width: 440px; padding: 28px; background: #1e293b; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  h1 { font-size: 19px; font-weight: 600; text-align: center; margin-bottom: 18px; color: #f8fafc; }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; background: #0f172a; padding: 4px; border-radius: 10px; }
  .tab { flex: 1; text-align: center; padding: 9px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; color: #94a3b8; transition: all .2s; user-select: none; }
  .tab.active { background: #3b82f6; color: #fff; }

  .steps { display: flex; justify-content: center; gap: 7px; margin-bottom: 24px; }
  .step-dot { width: 34px; height: 4px; border-radius: 2px; background: #334155; transition: background .3s, opacity .3s; }
  .step-dot.active { background: #3b82f6; }
  .step-dot.done { background: #22c55e; }

  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
  input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; transition: border-color .2s; }
  input:focus { border-color: #3b82f6; }
  input[readonly] { color: #4ade80; font-size: 12px; }
  .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; margin-top: 8px; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #2563eb; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-success:hover:not(:disabled) { background: #16a34a; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #dc2626; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .msg-box { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 13px; display: none; line-height: 1.5; white-space: pre-line; word-break: break-all; }
  .msg-box.info { display: block; background: #1e3a5f; color: #60a5fa; border: 1px solid #1e40af; }
  .msg-box.success { display: block; background: #14532d; color: #4ade80; border: 1px solid #166534; }
  .msg-box.error { display: block; background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; }
  .section { display: none; }
  .section.active { display: block; }
  .hint-line { font-size: 12px; color: #64748b; text-align: center; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <h1>一元机场 自动化助手</h1>

  <div class="tabs">
    <div class="tab active" id="tabReg" onclick="switchMode('register')">新用户注册</div>
    <div class="tab" id="tabLogin" onclick="switchMode('login')">老用户登录</div>
  </div>

  <div class="steps">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <!-- 阶段1：账号 -->
  <div class="section active" id="sec1">
    <div class="form-group">
      <label>邮箱账号</label>
      <input type="text" id="email" placeholder="例如 2995179799">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary" id="btnRegNext" onclick="regStart()">下一步</button>
    <button class="btn btn-primary" id="btnLoginGo" style="display:none" onclick="loginStart()">立即登录</button>
  </div>

  <!-- 阶段2：验证码（仅注册） -->
  <div class="section" id="sec2">
    <button class="btn btn-primary" id="btnSend" onclick="sendCode()">发送验证码</button>
    <div class="form-group" style="margin-top:14px">
      <label>邮箱验证码</label>
      <input type="text" id="verifyCode" placeholder="请输入收到的验证码" maxlength="6">
    </div>
    <button class="btn btn-success" id="btnConfirm" onclick="confirmReg()">确认注册</button>
    <div class="hint-line">注册成功后网站会自动登录，<br>接着进入付款环节。</div>
  </div>

  <!-- 阶段3：付款 + 结果 + 关闭（同一页，链接不会被切走） -->
  <div class="section" id="sec3">
    <button class="btn btn-primary" id="btnPay" onclick="doPayment()">开始自动选套餐并付款</button>
    <div id="payBox" class="msg-box"></div>
    <div class="form-group" style="margin-top:14px">
      <label>订阅链接（请先复制保存）</label>
      <input type="text" id="subLink" readonly placeholder="付款完成后这里显示订阅链接">
    </div>
    <button class="btn btn-danger" id="btnCloseReg" style="display:none" onclick="regClose()">关闭浏览器</button>
    <button class="btn btn-danger" id="btnCloseLogin" style="display:none" onclick="loginClose()">关闭浏览器</button>
  </div>

  <div id="globalMsg" class="msg-box"></div>
</div>

<script>
const API = '';
let mode = 'register';
let sessionId = null;
const $ = (id) => document.getElementById(id);
const globalMsg = $('globalMsg');

function showMsg(el, text, type) { el.textContent = text; el.className = 'msg-box ' + type; }
function hideMsg(el) { el.className = 'msg-box'; }

async function post(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ('请求失败 HTTP ' + r.status));
  return d;
}
async function postText(path, body) {
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  let t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).detail; } catch (e) {} throw new Error(m || ('HTTP ' + r.status)); }
  try { t = JSON.parse(t); } catch (e) {}  // FastAPI 返回字符串会包成 JSON，解析掉外层引号
  return t;
}
async function poll() {
  const r = await fetch(API + '/register/polling?session_id=' + sessionId);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || '轮询失败');
  return d;
}

// 显示阶段 1-3
function show(n) {
  for (let i = 1; i <= 3; i++) {
    $('sec' + i).className = 'section' + (i === n ? ' active' : '');
    $('dot' + i).className = 'step-dot' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

// 注册专用：边请求边轮询，等 expect 状态
function executeStep({ path, body, expect, btn, busy }) {
  return new Promise(async (resolve, reject) => {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = busy;
    let done = false;
    const judge = (d) => {
      if (done) return;
      if (d.status === expect) {
        done = true; clearInterval(t);
        btn.disabled = false; btn.textContent = old; resolve(d);
      } else if (d.status === 'register_fail') {
        done = true; clearInterval(t);
        btn.disabled = false; btn.textContent = old;
        reject(new Error(d.error_msg || '操作失败'));
      } else {
        showMsg(globalMsg, '处理中，当前状态：' + d.status, 'info');
      }
    };
    const t = setInterval(async () => { try { judge(await poll()); } catch (e) {} }, 1500);
    try {
      await post(path, body);
      setTimeout(async () => { try { judge(await poll()); } catch (e) {} }, 300);
    } catch (e) {
      done = true; clearInterval(t);
      btn.disabled = false; btn.textContent = old; reject(e);
    }
  });
}

function switchMode(m) {
  mode = m;
  $('tabReg').className = 'tab' + (m === 'register' ? ' active' : '');
  $('tabLogin').className = 'tab' + (m === 'login' ? ' active' : '');
  $('dot2').style.opacity = m === 'login' ? '0.25' : '1';
  $('btnRegNext').style.display = m === 'register' ? 'block' : 'none';
  $('btnLoginGo').style.display = m === 'login' ? 'block' : 'none';
  resetUI();
}

function resetUI() {
  sessionId = null;
  ['email', 'password', 'verifyCode', 'subLink'].forEach((id) => { $(id).value = ''; });
  hideMsg(globalMsg); hideMsg($('payBox'));
  // 恢复付款按钮、隐藏关闭按钮
  $('btnPay').style.display = 'block';
  $('btnPay').disabled = false;
  $('btnPay').textContent = '开始自动选套餐并付款';
  $('btnCloseReg').style.display = 'none';
  $('btnCloseLogin').style.display = 'none';
  show(1);
}

// ===== 注册 =====
async function regStart() {
  const email = $('email').value.trim();
  const password = $('password').value.trim();
  if (!email || !password) return showMsg(globalMsg, '请填写邮箱和密码', 'error');
  hideMsg(globalMsg);
  try {
    sessionId = (await post('/register/one', {})).session_id;
    await executeStep({
      path: '/register/two', body: { session_id: sessionId, email, password },
      expect: 'filling', btn: $('btnRegNext'), busy: '浏览器启动中...'
    });
    hideMsg(globalMsg); show(2);
  } catch (e) { showMsg(globalMsg, '启动失败：' + e.message, 'error'); }
}
async function sendCode() {
  hideMsg(globalMsg);
  try {
    await executeStep({
      path: '/register/three', body: { session_id: sessionId },
      expect: 'waiting_code', btn: $('btnSend'), busy: '发送中约15秒...'
    });
    showMsg(globalMsg, '验证码已发送，请打开邮箱查看', 'success');
  } catch (e) { showMsg(globalMsg, '发送失败：' + e.message, 'error'); }
}
async function confirmReg() {
  const code = $('verifyCode').value.trim();
  if (!code) return showMsg(globalMsg, '请输入验证码', 'error');
  hideMsg(globalMsg);
  try {
    await executeStep({
      path: '/register/four', body: { session_id: sessionId, verify_num: Number(code) },
      expect: 'finished', btn: $('btnConfirm'), busy: '注册中约15秒...'
    });
    hideMsg(globalMsg); show(3);
  } catch (e) { showMsg(globalMsg, '注册失败：' + e.message, 'error'); }
}

// ===== 登录 =====
async function loginStart() {
  const email = $('email').value.trim();
  const password = $('password').value.trim();
  if (!email || !password) return showMsg(globalMsg, '请填写邮箱和密码', 'error');
  hideMsg(globalMsg);
  const btn = $('btnLoginGo'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = '登录中约15秒...';
  try {
    sessionId = (await post('/login/one', {})).session_id;
    await post('/login/two', { session_id: sessionId, email, password });
    btn.disabled = false; btn.textContent = old;
    hideMsg(globalMsg); show(3);
  } catch (e) {
    btn.disabled = false; btn.textContent = old;
    showMsg(globalMsg, e.message, 'error');
  }
}

// ===== 付款（两种模式共用）=====
async function doPayment() {
  hideMsg(globalMsg);
  const btn = $('btnPay'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = '付款处理中约20秒...';
  try {
    const text = await postText('/payment/Payment', { session_id: sessionId });
    btn.disabled = false;
    // 同页显示订阅链接，并显示关闭按钮；付款按钮隐藏，链接一直可见
    const m = text.match(/https?:\/\/\S+/);
    $('subLink').value = m ? m[0] : text;   // 链接框放纯链接，方便复制
    showMsg($('payBox'), text, 'success');
    btn.style.display = 'none';
    $('btnCloseReg').style.display = mode === 'register' ? 'block' : 'none';
    $('btnCloseLogin').style.display = mode === 'login' ? 'block' : 'none';
    $('dot3').className = 'step-dot done';
  } catch (e) {
    btn.disabled = false; btn.textContent = old;
    showMsg(globalMsg, '付款失败：' + e.message, 'error');
  }
}

// ===== 关闭 =====
async function regClose() {
  const btn = $('btnCloseReg'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = '关闭中...';
  try {
    await executeStep({
      path: '/register/five', body: { session_id: sessionId },
      expect: 'over', btn, busy: '关闭中...'
    });
  } catch (e) {}
  resetUI();
}
async function loginClose() {
  const btn = $('btnCloseLogin'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = '关闭中...';
  try { await post('/payment/close', { session_id: sessionId }); } catch (e) {}
  btn.disabled = false; btn.textContent = old;
  resetUI();
}
</script>
</body>
</html>
